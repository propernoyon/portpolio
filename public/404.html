<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Page Not Found lol</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

    body {
      margin: 0;
      background: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: 10rem;
      margin: 0;
      color: #ff6b6b;
    }

    h2 {
      font-size: 2.5rem;
      margin: 0 0 20px 0;
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #555;
    }

    a {
      display: inline-block;
      padding: 12px 30px;
      background: #007bff;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 5px;
      transition: background 0.3s ease;
    }

    a:hover {
      background: #0056b3;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 6rem;
      }
      h2 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>Sorry, the page you are looking for does not exist or has been moved.</p>
    <a href="/">Go Back Home</a>
  </div>
</body>
</html>
