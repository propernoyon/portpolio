<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found (404) | Md Noyon</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/img/favicon-32x32.png" type="image/png" sizes="32x32" />
  <style>
    :root { --bg: #f4f6f8; --ink: #0f2233; --muted: #55667a; --accent: #0a6e6a; --on-accent: #fff; --amber: #e9a81c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c151d; --ink: #e9eef2; --muted: #9babb9; --accent: #48c9bf; --on-accent: #06211f; --amber: #f6cd61; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--ink);
      font: 1.0625rem/1.6 'Segoe UI', system-ui, sans-serif;
    }
    main { max-width: 520px; }
    .code { margin: 0; font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; }
    .code span { color: var(--amber); }
    h1 { margin: 16px 0 8px; font-size: 1.75rem; line-height: 1.15; }
    p { margin: 0 0 24px; color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px;
      border: 1.5px solid var(--accent); border-radius: 10px;
      background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
    }
    a + a { background: transparent; color: var(--ink); border-color: var(--muted); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">4<span>0</span>4</p>
    <h1>This page does not exist</h1>
    <p>The address may be mistyped, or the page has moved. These links will get you back on track.</p>
    <div class="links">
      <a href="/">Go to Md Noyon's homepage</a>
      <a href="/projects">See ERP projects</a>
    </div>
  </main>
</body>
</html>
